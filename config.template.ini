# =============================================================================
# ATAC-Quant v4 configuration file -- the single place where ALL inputs are
# defined once. Species-agnostic.
#
# Usage:  python run_atacquant.py --config config.ini
#         python run_atacquant.py --config config.ini --check    validate only, run nothing
#
# Rules:  * Every relative path is resolved against THIS FILE's directory.
#         * The five inputs in [inputs] are mandatory; every other section falls
#           back to a built-in default if omitted.
#         * A trailing "# comment" at the end of a line is stripped
#           automatically, so you can annotate freely in this template's style.
#         * Samples can be declared in exactly one of two ways:
#             A) point [inputs] samples at a sample-sheet file, or
#             B) write them inline under [samples] at the end of this file
#                (recommended -- then the whole project is one file).
# =============================================================================

[project]
name = MyProject            # Project name (used in log banners only)
outdir = ./MyProject_out    # Output directory (created automatically)
threads = 48                # Number of parallel worker threads
tmpdir = ./tmp_quant        # Scratch directory for step 03 (needs substantial free space)

[inputs]
genome = /path/genome.fasta         # Genome FASTA (any species; if you map reads, a bowtie2 index of the same prefix must exist)
gff = /path/annotation.gff3         # GFF3 annotation (must contain gene lines with an ID= attribute)
clusters = /path/my_cluster.tsv     # Homeologous-copy cluster table (each line: ClusterID <TAB> gene1,gene2,...)
ancestry = /path/ancestry.tsv       # Gene -> lineage assignment (needed only when ploidy = allo; leave empty for auto/diploid)
ploidy = allo                       # v4.3 ploidy mode:
                                    #   allo    = allopolyploid (subgenomes have diverged) -> ancestry REQUIRED, lineage layer produced
                                    #   auto    = autopolyploid (no subgenome divergence; no lineage concept) -> lineage layer skipped
                                    #   diploid = diploid against a TWO-HAPLOTYPE reference (2 copies per cluster) -> lineage layer skipped
                                    #   Note: diploid is an extension of this pipeline; the sibling project LQ has only auto/allo.
samples = ./samples.tsv             # Sample sheet (delete this line when you declare samples inline under [samples])
# bt2_index = /path/bt2/genome      # bowtie2 index prefix (default = the genome path with its extension stripped)

[map]
# Mapping and peak-calling parameters (used only for samples that are given as FASTQ)
assay = atac          # Assay type (v4.2), controls the Tn5 offset correction before peak calling:
                      #     atac = Tn5 transposase  -> alignmentSieve --ATACshift (+4/-5)
                      #     chip = antibody enrichment (ChIP) -> skip the correction (ChIP has no Tn5 staggered cuts)
bt2_k = 20
maxins = 1000
gsize = 1.0e10        # MACS2 effective genome size: sugarcane ~1e10 / human 2.7e9 / Arabidopsis 1.35e8
qvalue = 0.05         # 0.05 is usual for ATAC and TF ChIP; tighten to 0.01 for broad histone marks
macs2_env =           # Name of a conda env that has MACS2 (leave empty if macs2 is on PATH)
macs2 = macs2         # MACS2 executable name or path
macs2_extra =         # (optional) appended verbatim to MACS2 callpeak, e.g. --broad for broad histone marks
                      #   note: with --broad the output is _peaks.broadPeak and the pipeline detects it automatically
# Single-end vs paired-end is auto-detected in step 00. Single-end triggers a warning:
#   step 03 infers fragment span from TLEN, which degenerates for single-end data.
# For ChIP runs, ALWAYS confirm the library is paired-end, or the fragment-span estimate
# (and therefore every effective length) may be wrong.

[quant]
as_temp = 2.0         # EM temperature (default 2.0; usually leave alone)
bootstrap = 20        # Number of bootstrap replicates; 0 disables it (then there is no EM_SD column)
outside = model       # Genome-background handling: model (default) / ignore
lineage_map =         # (optional) Lineage-name normalisation, e.g. <long_name>=<SHORT>,<long_name>=<SHORT>
# lineage_kmers = SOF:/path/k15_a.fasta,SRO:/path/k15_b.fasta   # (optional, rarely needed)
quant_extra =         # (usually empty) passed verbatim to step 03, e.g. --buckets 8 for debugging

# ---- v4: convergence acceleration and parallel bootstrap (together they are ALL of v4's speedup) ----
em_accelerate = squarem   # squarem = SQUAREM acceleration (v4 default; roughly an order of magnitude fewer iterations)
                          # off     = no acceleration, line-for-line identical to v3 (use for control experiments)
bootstrap_threads = 0     # Bootstrap worker processes; 0 = automatic min(bootstrap, 8); 1 = sequential (= v3 behaviour)
                          # note: Linux forks, so workers share memory copy-on-write; on platforms without fork
                          #       large projects automatically degrade to 1
bootstrap_max_iter = 500  # Iteration cap for each bootstrap replicate (converges far earlier with em_accelerate)
em_max_iter = 2000        # Iteration cap for the main EM
em_tol = 1e-6             # Main EM convergence criterion. v4 default is 1e-6 (v3 used 1e-3):
                          #   SQUAREM stops earlier under the same criterion, so it needs 1e-6 to reach
                          #   an equivalent accuracy.
                          #   Measured on simulated data: squarem@1e-6 = 77 iterations, log-likelihood
                          #   within 4e-7 of the optimum; v3 (off@1e-3) = 368 iterations, within 1.7e-2.
                          #   To reproduce v3 exactly: em_accelerate = off and em_tol = 1e-3
em_prior = 1e-8           # Per-iteration zero-avoiding prior (fixed at 1e-8 in v3)
em_trace = false          # true = print the log-likelihood of every EM iteration (useful to verify the speedup)

[run]
steps = all           # all = map,peaks,features,quant,matrix,qc; a subset such as features,quant also works
min_samples = 1       # In step 01, a merged peak must be supported by at least this many samples
feature_extra =       # (usually empty) passed verbatim to step 02 (feature construction)

[stats]
run = true            # Run the statistics layer after the main flow (tier stratification / group tests / MDD)
mc = 2000             # Number of Monte Carlo draws
seed = 2026

# -----------------------------------------------------------------------------
# Sample sheet (inline is recommended, so a project is just this one file)
#   Format:  SampleName = r1 r2 bam peaks       (write - for a column you do not have)
#   Sample that already has a BAM: fill bam and peaks (with peaks missing, keep steps
#                                  containing map and peaks are called from the BAM)
#   Sample with only FASTQ:        fill r1 and r2; keep steps containing map and the
#                                  pipeline maps and calls peaks for you
# -----------------------------------------------------------------------------
[samples]
# A = -  -  /path/A.dedup.bam  /path/A_peaks.narrowPeak
# B = /path/B_R1.fq.gz  /path/B_R2.fq.gz  -  -
